name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  character-gameplay-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Extract the public Character Gameplay Conversations kit
        run: unzip -q v3/public/format-repositories/character-gameplay-conversations-v1/downloads/character-gameplay-conversations-0.1.3.zip -d "$RUNNER_TEMP/character-gameplay-kit"
      - name: Test the extracted runtime without providers
        working-directory: ${{ runner.temp }}/character-gameplay-kit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run smoke
  repo-builder-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local media and archive tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg zip unzip
      - name: Extract the standalone Repo Builder artifact
        run: unzip -q v3/public/format-repositories/repo-builder-v1/downloads/wiggly-repo-builder-0.1.1.zip -d "$RUNNER_TEMP/repo-builder-kit"
      - name: Check source and released kit content match
        run: node v3/public/format-repositories/repo-builder-v1/verify-kit.mjs "$RUNNER_TEMP/repo-builder-kit"
      - name: Prove the extracted kit without network or providers
        working-directory: ${{ runner.temp }}/repo-builder-kit
        run: |
          npm test
          npm run smoke
  lego-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEGO_DISABLE_PAID_CALLS: "1"
      LEGO_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Extract only the published consumer archive
        run: unzip -q v3/public/format-repositories/lego-music-video-v1/downloads/wiggly-lego-music-video-format-kit.zip -d "$RUNNER_TEMP/lego-kit"
      - name: Install and prove the actual package without provider calls
        working-directory: ${{ runner.temp }}/lego-kit/wiggly-lego-music-video-format-kit/v3
        run: |
          npm install
          npm audit
          npm test
          npm run format:lego -- check
          npm run smoke
          npm run format:lego -- import --run=cheesecake-ci --input="$PWD/public/format-repositories/lego-music-video-v1/goldens/cheesecake/input.json"
          npm run format:lego -- render --run=cheesecake-ci
          npm run format:lego -- inspect --run=cheesecake-ci
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_V3_CONVEX_URL: ${{ vars.NEXT_PUBLIC_V3_CONVEX_URL || 'https://wry-viper-639.convex.cloud' }}
      NEXT_PUBLIC_V3_CONVEX_SITE_URL: ${{ vars.NEXT_PUBLIC_V3_CONVEX_SITE_URL || 'https://wry-viper-639.convex.site' }}
      CREATE_SMOKE_BASE_URL: http://localhost:3020

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate standalone v3 lockfile
        working-directory: v3
        run: npm ci --workspaces=false --include=optional --dry-run

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke /create and every Repo page
        run: |
          set -euo pipefail

          npm run start > /tmp/wiggly-v3-start.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            if curl -fsS "$CREATE_SMOKE_BASE_URL/create" >/dev/null; then
              npm run smoke:create
              npm run smoke:repos -w @wiggly/v3
              npm run smoke:character-gameplay -w @wiggly/v3
              exit 0
            fi
            sleep 1
          done

          cat /tmp/wiggly-v3-start.log
          exit 1
