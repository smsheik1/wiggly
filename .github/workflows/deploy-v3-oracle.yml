name: Deploy v3 to Oracle

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: oracle-v3-production
  cancel-in-progress: true

jobs:
  deploy-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_BRANCH: main
      V3_CONVEX_DEPLOY_KEY: ${{ secrets.V3_CONVEX_DEPLOY_KEY }}
      V3_CONVEX_URL: ${{ vars.V3_CONVEX_URL || 'https://wry-viper-639.convex.cloud' }}
      NEXT_PUBLIC_V3_CONVEX_URL: ${{ vars.NEXT_PUBLIC_V3_CONVEX_URL || 'https://wry-viper-639.convex.cloud' }}
      NEXT_PUBLIC_V3_CONVEX_SITE_URL: ${{ vars.NEXT_PUBLIC_V3_CONVEX_SITE_URL || 'https://wry-viper-639.convex.site' }}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      BRANDFETCH_API_KEY: ${{ secrets.BRANDFETCH_API_KEY }}
      FISH_STUDIO_APIKEY: ${{ secrets.FISH_STUDIO_APIKEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      WIGGLY_MAKER_LIVE_ANALYSIS: "true"
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      NVIDIA_NIM_BASE_URL: ${{ vars.NVIDIA_NIM_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      APP_URL: ${{ vars.APP_URL || 'https://wiggly.agentenamel.com' }}
      V3_PUBLIC_BASE_URL: ${{ vars.V3_PUBLIC_BASE_URL || 'https://wiggly.agentenamel.com' }}
      PAID_PASS_PRICE_CENTS: ${{ vars.PAID_PASS_PRICE_CENTS || '100' }}
      PAID_PASS_DAYS: ${{ vars.PAID_PASS_DAYS || '7' }}
      EARLY_ACCESS_MONTHLY_PRICE_CENTS: ${{ vars.EARLY_ACCESS_MONTHLY_PRICE_CENTS || '900' }}
      TTS_MODEL: gemini-3.1-flash-tts-preview
      V3_PORT: "3020"
      V3_PUBLIC_HOST: wiggly.agentenamel.com
      PM2_V3_APP_NAME: wiggly-v3
      PM2_V3_WORKER_APP_NAME: wiggly-v3-render-worker

    steps:
      - name: Deploy v3 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: DEPLOY_BRANCH,V3_CONVEX_DEPLOY_KEY,V3_CONVEX_URL,NEXT_PUBLIC_V3_CONVEX_URL,NEXT_PUBLIC_V3_CONVEX_SITE_URL,NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN,NEXT_PUBLIC_POSTHOG_HOST,FIRECRAWL_API_KEY,DEEPGRAM_API_KEY,GEMINI_API_KEY,OPENROUTER_API_KEY,REPLICATE_API_TOKEN,BRANDFETCH_API_KEY,FISH_STUDIO_APIKEY,ELEVENLABS_API_KEY,WIGGLY_MAKER_LIVE_ANALYSIS,NVIDIA_NIM_API_KEY,NVIDIA_NIM_BASE_URL,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,SESSION_SECRET,APP_URL,V3_PUBLIC_BASE_URL,PAID_PASS_PRICE_CENTS,PAID_PASS_DAYS,EARLY_ACCESS_MONTHLY_PRICE_CENTS,TTS_MODEL,V3_PORT,V3_PUBLIC_HOST,PM2_V3_APP_NAME,PM2_V3_WORKER_APP_NAME
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/Meta-ads-builder-2
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git restore --worktree -- v3/convex/_generated/api.d.ts v3/next-env.d.ts
            git pull --ff-only origin "$DEPLOY_BRANCH"
            chmod +x scripts/deploy-v3-oracle.sh
            bash scripts/deploy-v3-oracle.sh
